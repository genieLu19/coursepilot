[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "coursepilot"
version = "0.1.0"
description = "An AI learning assistant with hybrid RAG, source citations and persistent progress"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "openai>=2,<3",
  "numpy>=1.26,<3", "pypdf>=5,<7", "python-dotenv>=1,<2",
  "python-multipart>=0.0.20,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["coursepilot*"]

[tool.setuptools.package-data]
coursepilot = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
